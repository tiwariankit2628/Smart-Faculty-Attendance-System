services:
  - type: web
    name: smart-faculty-attendance-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: REDIS_ALLOW_FALLBACK
        value: "true"
      - key: ENABLE_CAMPUS_NETWORK_CHECK
        value: "false"
      - key: MOCK_FACE_SERVICE
        value: "true"
      - key: ALLOW_MOCK_FACE_SERVICE
        value: "true"
      - key: ALLOW_LOCALHOST_CORS
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
