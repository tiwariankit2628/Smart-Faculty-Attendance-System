version: '3.8'

services:
  face-verification-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lpu-face-verification-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - FACE_SERVICE_API_KEY=internal_secret_face_service_key_7788
      - ALLOWED_ORIGINS=["http://localhost:5000", "http://backend:5000"]
      - SIMILARITY_THRESHOLD=0.75
      - LIVENESS_THRESHOLD=0.70
      - MIN_IMAGE_DIMENSION=150
      - MAX_IMAGE_SIZE_BYTES=10485760
      - BLUR_THRESHOLD=65.0
      - STORAGE_DIR=/app/data/embeddings
    volumes:
      - face_embeddings_data:/app/data/embeddings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - attendance-internal-net

volumes:
  face_embeddings_data:
    driver: local

networks:
  attendance-internal-net:
    driver: bridge
